<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SurakshaSetu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef3fb;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #173b6c;
            margin-top: 0;
        }

        p {
            color: #75839a;
            line-height: 1.6;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 24px 0 8px;
            color: #173b6c;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5deec;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #2670ca;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            background: #2670ca;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #2670ca;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>
<div class="card">
    <h2>Forgot Password?</h2>

    <p>
        Enter your registered faculty email address to request a password reset.
    </p>

    <form th:action="@{/faculty-portal/forgot-password}"
          method="post">

        <label for="email">Faculty Email</label>

        <input type="email"
               id="email"
               name="email"
               placeholder="Enter your faculty email"
               required>

        <button type="submit">Send Reset Link</button>
    </form>

    <a th:href="@{/faculty-portal/login}" class="back">
        ← Back to Login
    </a>
</div>
</body>
</html>
