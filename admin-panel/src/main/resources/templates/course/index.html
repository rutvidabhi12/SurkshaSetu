<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{layout/base :: layout(~{::section})}">

<section>

    <!-- ================================================= -->
    <!-- PAGE HEADER -->
    <!-- ================================================= -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="page-title mb-1">
                Course Management
            </h2>

            <p class="text-muted mb-0">
                Manage all courses from one place.
            </p>

        </div>


        <div class="d-flex gap-2">

            <a th:href="@{/students}"
               class="btn btn-outline-secondary">

                <i class="bi bi-arrow-left me-2"></i>

                Home

            </a>


            <a th:href="@{/courses/add}"
               class="btn btn-success">

                <i class="bi bi-plus-circle me-2"></i>

                Add Course

            </a>

        </div>

    </div>


    <!-- ================================================= -->
    <!-- FILTER CARD -->
    <!-- ================================================= -->

    <div class="card shadow-sm mb-4">

        <div class="card-body p-4">

            <div class="row g-3 align-items-end">


                <!-- DEPARTMENT FILTER -->

                <div class="col-lg-4 col-md-6">

                    <label class="form-label fw-semibold">

                        Department

                    </label>


                    <select id="departmentFilter"
                            class="form-select">

                        <option value="">

                            Select Department

                        </option>


                        <option th:each="department : ${departments}"
                                th:value="${department.id}"
                                th:text="${department.departmentName}"
                                th:selected="${selectedDepartment != null
                                    and selectedDepartment == department.id}">

                        </option>

                    </select>

                </div>


                <!-- SEARCH -->

                <div class="col-lg-5 col-md-6">

                    <label class="form-label fw-semibold">

                        Search

                    </label>


                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-search"></i>

                        </span>


                        <input type="text"
                               id="courseSearch"
                               class="form-control"
                               placeholder="Search Course...">

                    </div>

                </div>


                <!-- APPLY FILTER -->

                <div class="col-lg-3">

                    <button type="button"
                            id="applyDepartmentFilter"
                            class="btn w-100"
                            style="background:#5F473B;color:white;">

                        <i class="bi bi-funnel-fill me-2"></i>

                        Apply Filter

                    </button>

                </div>

            </div>


            <!-- CLEAR FILTER -->

            <div class="mt-3">

                <button type="button"
                        id="clearDepartmentFilter"
                        class="btn btn-sm btn-outline-secondary">

                    <i class="bi bi-x-circle me-1"></i>

                    Clear Department Filter

                </button>

            </div>

        </div>

    </div>


    <!-- ================================================= -->
    <!-- COURSE COUNT -->
    <!-- ================================================= -->

    <div class="card shadow-sm mb-4">

        <div class="card-body p-4">

            <div class="d-flex justify-content-between align-items-center">

                <h4 class="mb-0">

                    Course List

                </h4>


                <span class="badge bg-success fs-6 px-3 py-2">

                    Total Courses :

                    <span id="courseCount"
                          th:text="${#lists.size(courses)}">

                        0

                    </span>

                </span>

            </div>

        </div>

    </div>


    <!-- ================================================= -->
    <!-- COURSE TABLE -->
    <!-- ================================================= -->

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead style="background:#212529;color:white;">

                    <tr>

                        <th width="80">
                            #
                        </th>

                        <th>
                            Course Name
                        </th>

                        <th>
                            Total Semester
                        </th>

                        <th>
                            Department
                        </th>

                        <th>
                            Status
                        </th>

                        <th width="160">
                            Action
                        </th>

                    </tr>

                    </thead>


                    <tbody id="courseTableBody">


                    <!-- NO DATA -->

                    <tr id="noCourseData"
                        th:if="${#lists.isEmpty(courses)}">

                        <td colspan="6"
                            class="text-center py-5">

                            <i class="bi bi-book fs-1 text-secondary"></i>

                            <h5 class="mt-3">

                                No Course Found

                            </h5>

                            <p class="text-muted mb-0">

                                No course available for this selection.

                            </p>

                        </td>

                    </tr>


                    <!-- COURSE LIST -->

                    <tr th:each="course, stat : ${courses}"
                        class="course-row"
                        th:data-course-name="${course.courseName}">


                        <!-- NUMBER -->

                        <td th:text="${stat.count}">

                            1

                        </td>


                        <!-- COURSE NAME -->

                        <td th:text="${course.courseName}">

                            Course Name

                        </td>


                        <!-- TOTAL SEMESTER -->

                        <td th:text="${course.totalSemester}">

                            6

                        </td>


                        <!-- DEPARTMENT -->

                        <td th:text="${course.department.departmentName}">

                            Department

                        </td>


                        <!-- STATUS -->

                        <td>

                            <span class="badge bg-success"
                                  th:if="${course.status == 'ACTIVE'
                                      or course.status == 'Active'
                                      or course.status == 'active'}">

                                Active

                            </span>


                            <span class="badge bg-danger"
                                  th:unless="${course.status == 'ACTIVE'
                                      or course.status == 'Active'
                                      or course.status == 'active'}">

                                Inactive

                            </span>

                        </td>


                        <!-- ACTION -->

                        <td>


                            <!-- EDIT -->

                            <a th:href="@{/courses/edit/{id}(id=${course.id})}"
                               class="btn btn-warning btn-sm"
                               title="Edit">

                                <i class="bi bi-pencil-square"></i>

                            </a>


                            <!-- DELETE -->

                            <a href="#"
                               class="btn btn-danger btn-sm"
                               title="Delete"
                               th:onclick="'deleteCourse('
                                    + ${course.id}
                                    + '); return false;'">

                                <i class="bi bi-trash"></i>

                            </a>


                        </td>

                    </tr>


                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- ================================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                const departmentFilter =
                    document.getElementById(
                        "departmentFilter"
                    );


                const applyDepartmentFilter =
                    document.getElementById(
                        "applyDepartmentFilter"
                    );


                const clearDepartmentFilter =
                    document.getElementById(
                        "clearDepartmentFilter"
                    );


                const courseSearch =
                    document.getElementById(
                        "courseSearch"
                    );


                const courseRows =
                    Array.from(
                        document.querySelectorAll(
                            ".course-row"
                        )
                    );


                const courseCount =
                    document.getElementById(
                        "courseCount"
                    );


                /* ==========================================
                   DEPARTMENT FILTER
                ========================================== */

                applyDepartmentFilter
                    .addEventListener(
                        "click",
                        function () {

                            const departmentId =
                                departmentFilter.value;


                            if (!departmentId) {

                                window.location.href =
                                    "/courses";

                                return;

                            }


                            window.location.href =
                                "/courses?departmentId="
                                + departmentId;

                        }
                    );


                /* ==========================================
                   CLEAR DEPARTMENT FILTER
                ========================================== */

                clearDepartmentFilter
                    .addEventListener(
                        "click",
                        function () {

                            departmentFilter.value = "";

                            window.location.href =
                                "/courses";

                        }
                    );


                /* ==========================================
                   COURSE NAME SEARCH
                   SEARCH ONLY COURSE NAME
                ========================================== */

                courseSearch
                    .addEventListener(
                        "input",
                        function () {

                            const keyword =
                                this.value
                                    .trim()
                                    .toLowerCase();


                            let visibleCount = 0;


                            courseRows.forEach(
                                function (row) {


                                    const courseName =
                                        (
                                            row.getAttribute(
                                                "data-course-name"
                                            ) || ""
                                        )
                                        .toLowerCase();


                                    if (
                                        courseName.includes(
                                            keyword
                                        )
                                    ) {

                                        row.style.display =
                                            "";

                                        visibleCount++;

                                    } else {

                                        row.style.display =
                                            "none";

                                    }

                                }
                            );


                            courseCount.textContent =
                                visibleCount;


                            const noCourseData =
                                document.getElementById(
                                    "noCourseData"
                                );


                            if (
                                visibleCount === 0
                            ) {

                                if (noCourseData) {

                                    noCourseData.style.display =
                                        "";

                                }

                            } else {

                                if (noCourseData) {

                                    noCourseData.style.display =
                                        "none";

                                }

                            }

                        }
                    );

            }
        );


        /* ==========================================
           DELETE COURSE
        ========================================== */

        function deleteCourse(id) {

            Swal.fire({

                title: "Delete Course?",

                text:
                    "This course will be permanently deleted.",

                icon: "warning",

                showCancelButton: true,

                confirmButtonColor: "#dc3545",

                cancelButtonColor: "#6c757d",

                confirmButtonText:
                    "Yes, Delete",

                cancelButtonText:
                    "Cancel"

            }).then(
                function (result) {

                    if (result.isConfirmed) {

                        window.location.href =
                            "/courses/delete/"
                            + id;

                    }

                }
            );

        }

    </script>


</section>

</div>

</html>
