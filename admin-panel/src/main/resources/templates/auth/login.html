<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SurkshaSetu | Admin Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">

</head>

<body>

<div class="container-fluid p-0">

    <div class="row g-0 login-page">

        <!-- LEFT PANEL -->

        <div class="col-lg-7 left-panel">

            <div class="overlay">

                <img th:src="@{/images/logo.png}"
                     class="logo"
                     alt="Logo">

                <h1>Surksha<span>Setu</span></h1>

                <p class="tagline">

                    AI Enabled Campus Safety &
                    Student Assistance System

                </p>

                <div class="feature-list">

                    <div>

                        <i class="bi bi-shield-check"></i>

                        Secure

                    </div>

                    <div>

                        <i class="bi bi-bell-fill"></i>

                        Alert

                    </div>

                    <div>

                        <i class="bi bi-people-fill"></i>

                        Assist

                    </div>

                </div>

            </div>

        </div>

        <!-- RIGHT PANEL -->

        <div class="col-lg-5 login-section">

            <div class="login-card">

                <p class="welcome">

                    WELCOME BACK!

                </p>

                <h2>

                    Admin Login

                </h2>

                <form>

                    <div class="mb-3">

                        <label>

                            Username

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-person-fill"></i>

                            </span>

                            <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Enter Username">

                        </div>

                    </div>

                    <div class="mb-4">

                        <label>

                            Password

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-lock-fill"></i>

                            </span>

                            <input
                                id="password"
                                type="password"
                                class="form-control"
                                placeholder="Enter Password">

                            <span class="input-group-text">
                                <i class="bi bi-eye" id="togglePassword"></i>
                            </span>

                        </div>

                    </div>

                    <div class="d-flex justify-content-between mb-4">

                        <div class="form-check">

                            <input
                                    class="form-check-input"
                                    type="checkbox">

                            <label
                                    class="form-check-label">

                                Remember Me

                            </label>

                        </div>

                        <a href="#">

                            Forgot Password?

                        </a>

                    </div>

                    <button type="submit" class="btn login-btn">
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        LOGIN TO DASHBOARD
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
