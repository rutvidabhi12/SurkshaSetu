<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{layout/base :: layout(~{::section})}">

<section>

    <!-- PAGE HEADER -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="page-title mb-1">
                Add Faculty
            </h2>

            <p class="text-muted mb-0">
                Create a new faculty member.
            </p>

        </div>

        <a th:href="@{/faculty}"
           class="btn btn-outline-secondary">

            <i class="bi bi-arrow-left me-2"></i>

            Back

        </a>

    </div>


    <!-- FACULTY FORM -->

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <div class="row g-4">


                <!-- FIRST NAME -->

                <div class="col-md-4">

                    <label class="form-label fw-semibold">
                        First Name
                    </label>

                    <input type="text"
                           class="form-control"
                           placeholder="Enter First Name">

                </div>


                <!-- MIDDLE NAME -->

                <div class="col-md-4">

                    <label class="form-label fw-semibold">
                        Middle Name
                    </label>

                    <input type="text"
                           class="form-control"
                           placeholder="Enter Middle Name">

                </div>


                <!-- LAST NAME -->

                <div class="col-md-4">

                    <label class="form-label fw-semibold">
                        Last Name
                    </label>

                    <input type="text"
                           class="form-control"
                           placeholder="Enter Last Name">

                </div>


                <!-- FACULTY CODE -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Faculty Code
                    </label>

                    <input type="text"
                           class="form-control"
                           placeholder="Enter Faculty Code">

                </div>


                <!-- EMAIL -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Email
                    </label>

                    <input type="email"
                           class="form-control"
                           placeholder="Enter Email">

                </div>


                <!-- MOBILE -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Mobile
                    </label>

                    <input type="tel"
                           class="form-control"
                           placeholder="Enter Mobile Number">

                </div>


                <!-- DEPARTMENT -->

                <div class="col-md-6">

                    <div class="d-flex align-items-center mb-2">

                        <label class="form-label fw-semibold mb-0">
                            Department
                        </label>

                        <a th:href="@{/departments/add}"
                           class="btn btn-success ms-auto add-btn"
                           title="Add Department">

                            <i class="bi bi-plus-lg"></i>

                        </a>

                    </div>

                    <select class="form-select">

                        <option value="">
                            Select Department
                        </option>

                    </select>

                </div>


                <!-- DESIGNATION -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Designation
                    </label>

                    <select class="form-select">

                        <option value="">
                            Select Designation
                        </option>

                        <option value="Professor">
                            Professor
                        </option>

                        <option value="Associate Professor">
                            Associate Professor
                        </option>

                        <option value="Assistant Professor">
                            Assistant Professor
                        </option>

                        <option value="Lecturer">
                            Lecturer
                        </option>

                    </select>

                </div>


                <!-- GENDER -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Gender
                    </label>

                    <select class="form-select">

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- PROFILE PHOTO -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Profile Photo
                    </label>

                    <input type="file"
                           class="form-control"
                           accept="image/*">

                </div>


                <!-- STATUS -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Status
                    </label>

                    <select class="form-select">

                        <option value="true">
                            Active
                        </option>

                        <option value="false">
                            Inactive
                        </option>

                    </select>

                </div>


            </div>

        </div>


        <!-- FOOTER -->

        <div class="card-footer text-end">

            <a th:href="@{/faculty}"
               class="btn btn-secondary">

                Cancel

            </a>

            <button type="button"
                    class="btn btn-success ms-2">

                <i class="bi bi-check-circle me-2"></i>

                Save Faculty

            </button>

        </div>

    </div>


</section>

</div>

</html>
