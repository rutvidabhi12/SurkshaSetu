<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{layout/base :: layout(~{::section})}">

<section>

    <!-- ================= PAGE HEADER ================= -->

    <div class="faculty-page-header">

        <div>
            <h2 class="page-title mb-1">
                Faculty Management
            </h2>

            <p class="text-muted mb-0">
                Manage all faculty members from one place.
            </p>
        </div>

        <a th:href="@{/faculty/add}"
           class="btn btn-success">

            <i class="bi bi-plus-circle me-2"></i>
            Add Faculty

        </a>

    </div>


    <!-- ================= ALERTS ================= -->

    <div th:if="${success}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">

        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${success}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>


    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show"
         role="alert">

        <i class="bi bi-x-circle-fill me-2"></i>
        <span th:text="${error}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>


    <div th:if="${warning}"
         class="alert alert-warning alert-dismissible fade show"
         role="alert">

        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${warning}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>


    <!-- ================= SEARCH + FILTER ================= -->

    <div class="card faculty-filter-card shadow-sm mb-3">

        <div class="card-body">

            <div class="row g-3">

                <!-- SEARCH -->

                <div class="col-lg-4 col-md-6">

                    <label class="form-label">
                        Search Faculty
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>

                        <input type="text"
                               id="searchFaculty"
                               class="form-control"
                               placeholder="Name, code, email, mobile...">

                    </div>

                </div>


                <!-- DEPARTMENT -->

                <div class="col-lg-2 col-md-3">

                    <label class="form-label">
                        Department
                    </label>

                    <select id="departmentFilter"
                            class="form-select">

                        <option value="">
                            All Departments
                        </option>

                        <option th:each="department : ${departments}"
                                th:value="${department.departmentName}"
                                th:text="${department.departmentName}">
                        </option>

                    </select>

                </div>


                <!-- DESIGNATION -->

                <div class="col-lg-2 col-md-3">

                    <label class="form-label">
                        Designation
                    </label>

                    <select id="designationFilter"
                            class="form-select">

                        <option value="">
                            All Designations
                        </option>

                        <option value="Dean & Professor">
                            Dean & Professor
                        </option>

                        <option value="Head & Professor">
                            Head & Professor
                        </option>

                        <option value="Senior Professor">
                            Senior Professor
                        </option>

                        <option value="Professor">
                            Professor
                        </option>

                        <option value="Associate Professor">
                            Associate Professor
                        </option>

                        <option value="Assistant Professor">
                            Assistant Professor
                        </option>

                        <option value="Lecturer">
                            Lecturer
                        </option>

                    </select>

                </div>


                <!-- GENDER -->

                <div class="col-lg-2 col-md-3">

                    <label class="form-label">
                        Gender
                    </label>

                    <select id="genderFilter"
                            class="form-select">

                        <option value="">
                            All Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- STATUS -->

                <div class="col-lg-2 col-md-3">

                    <label class="form-label">
                        Status
                    </label>

                    <select id="statusFilter"
                            class="form-select">

                        <option value="">
                            All Status
                        </option>

                        <option value="active">
                            Active
                        </option>

                        <option value="inactive">
                            Inactive
                        </option>

                    </select>

                </div>

            </div>


            <!-- RESET -->

            <div class="text-end mt-3">

                <button type="button"
                        id="resetFilters"
                        class="btn btn-outline-secondary btn-sm">

                    <i class="bi bi-arrow-counterclockwise me-1"></i>
                    Reset Filters

                </button>

            </div>

        </div>

    </div>


    <!-- ================= FACULTY TABLE ================= -->

    <div class="card faculty-table-card shadow-sm">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table faculty-table align-middle mb-0">

                    <thead>

                        <tr>

                            <th>Photo</th>
                            <th>Faculty Code</th>
                            <th>Faculty Name</th>
                            <th>Department</th>
                            <th>Designation</th>
                            <th>Gender</th>
                            <th>Mobile</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="facultyTableBody">

                        <tr th:each="faculty : ${faculties}"
                            class="faculty-row"

                            th:attr="
                            data-name=${faculty.firstName + ' ' + faculty.middleName + ' ' + faculty.lastName},
                            data-code=${faculty.facultyCode},
                            data-department=${faculty.department},
                            data-designation=${faculty.designation},
                            data-gender=${faculty.gender},
                            data-mobile=${faculty.mobile},
                            data-email=${faculty.email},
                            data-status=${faculty.active ? 'active' : 'inactive'}">


                            <!-- PHOTO -->

                            <td>

                                <div class="faculty-photo">

                                    <img th:if="${faculty.photo != null and !faculty.photo.isEmpty()}"
                                         th:src="@{'http://localhost:8082/uploads/faculty/' + ${faculty.photo}}"
                                         alt="Faculty Photo">

                                    <i th:unless="${faculty.photo != null and !faculty.photo.isEmpty()}"
                                       class="bi bi-person-circle">
                                    </i>

                                </div>

                            </td>


                            <!-- CODE -->

                            <td>
                                <span th:text="${faculty.facultyCode}">
                                </span>
                            </td>


                            <!-- NAME -->

                            <td>

                                <strong>

                                    <span th:text="${faculty.firstName}">
                                    </span>

                                    <span th:if="${faculty.middleName != null and !faculty.middleName.isEmpty()}"
                                          th:text="' ' + ${faculty.middleName}">
                                    </span>

                                    <span th:text="' ' + ${faculty.lastName}">
                                    </span>

                                </strong>

                            </td>


                            <!-- DEPARTMENT -->

                            <td th:text="${faculty.department}">
                            </td>


                            <!-- DESIGNATION -->

                            <td th:text="${faculty.designation}">
                            </td>


                            <!-- GENDER -->

                            <td th:text="${faculty.gender}">
                            </td>


                            <!-- MOBILE -->

                            <td th:text="${faculty.mobile}">
                            </td>


                            <!-- EMAIL -->

                            <td class="faculty-email"
                                th:text="${faculty.email}">
                            </td>


                            <!-- STATUS -->

                            <td>

                                <span th:if="${faculty.active}"
                                      class="badge bg-success">

                                    Active

                                </span>

                                <span th:unless="${faculty.active}"
                                      class="badge bg-secondary">

                                    Inactive

                                </span>

                            </td>


                            <!-- ACTION -->

                            <td>

                                <div class="faculty-actions">

                                    <a th:href="@{'/faculty/view/' + ${faculty.id}}"
                                       class="btn btn-info btn-sm"
                                       title="View">

                                        <i class="bi bi-eye"></i>

                                    </a>


                                    <a th:href="@{'/faculty/edit/' + ${faculty.id}}"
                                       class="btn btn-warning btn-sm"
                                       title="Edit">

                                        <i class="bi bi-pencil-square"></i>

                                    </a>


                                    <button type="button"
                                            class="btn btn-danger btn-sm"
                                            title="Delete"
                                            th:onclick="'deleteFaculty(' + ${faculty.id} + ')'">

                                        <i class="bi bi-trash"></i>

                                    </button>

                                </div>

                            </td>

                        </tr>


                    </tbody>

                </table>


                <!-- NO RESULT -->

                <div id="noFacultyResult"
                     class="text-center py-5"
                     style="display:none;">

                    <i class="bi bi-search"
                       style="font-size:40px;">
                    </i>

                    <p class="mt-2 mb-0">
                        No faculty found.
                    </p>

                </div>

            </div>

        </div>


        <!-- ================= PAGINATION ================= -->

        <div class="faculty-pagination">

            <div id="facultyCount">

                Showing <strong>0</strong> - <strong>0</strong>
                of <strong>0</strong> faculty

            </div>


            <div class="pagination-buttons">

                <button type="button"
                        id="previousPage"
                        class="btn btn-outline-secondary btn-sm">

                    <i class="bi bi-chevron-left"></i>
                    Previous

                </button>


                <span id="pageNumber"
                      class="page-number">

                    1

                </span>


                <button type="button"
                        id="nextPage"
                        class="btn btn-outline-secondary btn-sm">

                    Next
                    <i class="bi bi-chevron-right"></i>

                </button>

            </div>

        </div>

    </div>

</section>

</div>


<!-- ================= DELETE POPUP ================= -->

<script>

function deleteFaculty(id) {

    const confirmed = confirm(
        "Are you sure you want to delete this faculty?"
    );

    if (confirmed) {

        window.location.href =
            "/faculty/delete/" + id;

    }
}


/* =====================================================
   SEARCH + FILTER + PAGINATION
===================================================== */

document.addEventListener("DOMContentLoaded", function () {

    const searchInput =
        document.getElementById("searchFaculty");

    const departmentFilter =
        document.getElementById("departmentFilter");

    const designationFilter =
        document.getElementById("designationFilter");

    const genderFilter =
        document.getElementById("genderFilter");

    const statusFilter =
        document.getElementById("statusFilter");

    const resetButton =
        document.getElementById("resetFilters");

    const previousButton =
        document.getElementById("previousPage");

    const nextButton =
        document.getElementById("nextPage");

    const pageNumber =
        document.getElementById("pageNumber");

    const facultyCount =
        document.getElementById("facultyCount");

    const noResult =
        document.getElementById("noFacultyResult");


    const rows = Array.from(
        document.querySelectorAll(".faculty-row")
    );


    const recordsPerPage = 50;

    let currentPage = 1;


    function filterRows() {

        const search =
            searchInput.value
                .toLowerCase()
                .trim();

        const department =
            departmentFilter.value
                .toLowerCase();

        const designation =
            designationFilter.value
                .toLowerCase();

        const gender =
            genderFilter.value
                .toLowerCase();

        const status =
            statusFilter.value
                .toLowerCase();


        return rows.filter(function (row) {

            const name =
                (row.dataset.name || "")
                    .toLowerCase();

            const code =
                (row.dataset.code || "")
                    .toLowerCase();

            const rowDepartment =
                (row.dataset.department || "")
                    .toLowerCase();

            const rowDesignation =
                (row.dataset.designation || "")
                    .toLowerCase();

            const rowGender =
                (row.dataset.gender || "")
                    .toLowerCase();

            const mobile =
                (row.dataset.mobile || "")
                    .toLowerCase();

            const email =
                (row.dataset.email || "")
                    .toLowerCase();

            const rowStatus =
                (row.dataset.status || "")
                    .toLowerCase();


            const matchesSearch =
                !search ||
                name.includes(search) ||
                code.includes(search) ||
                mobile.includes(search) ||
                email.includes(search);


            const matchesDepartment =
                !department ||
                rowDepartment === department;


            const matchesDesignation =
                !designation ||
                rowDesignation === designation;


            const matchesGender =
                !gender ||
                rowGender === gender;


            const matchesStatus =
                !status ||
                rowStatus === status;


            return (
                matchesSearch &&
                matchesDepartment &&
                matchesDesignation &&
                matchesGender &&
                matchesStatus
            );

        });

    }


    function renderTable() {

        const filteredRows =
            filterRows();


        const total =
            filteredRows.length;


        const totalPages =
            Math.max(
                1,
                Math.ceil(
                    total / recordsPerPage
                )
            );


        if (currentPage > totalPages) {

            currentPage = totalPages;

        }


        const startIndex =
            (currentPage - 1)
            * recordsPerPage;


        const endIndex =
            Math.min(
                startIndex + recordsPerPage,
                total
            );


        rows.forEach(function (row) {

            row.style.display = "none";

        });


        filteredRows
            .slice(
                startIndex,
                endIndex
            )
            .forEach(function (row) {

                row.style.display =
                    "table-row";

            });


        if (total === 0) {

            noResult.style.display =
                "block";

        } else {

            noResult.style.display =
                "none";

        }


        if (total === 0) {

            facultyCount.innerHTML =
                'Showing <strong>0</strong> - <strong>0</strong> of <strong>0</strong> faculty';

        } else {

            facultyCount.innerHTML =
                'Showing <strong>'
                + (startIndex + 1)
                + '</strong> - <strong>'
                + endIndex
                + '</strong> of <strong>'
                + total
                + '</strong> faculty';

        }


        pageNumber.textContent =
            currentPage
            + " / "
            + totalPages;


        previousButton.disabled =
            currentPage <= 1;


        nextButton.disabled =
            currentPage >= totalPages;

    }


    function resetToFirstPage() {

        currentPage = 1;

        renderTable();

    }


    searchInput.addEventListener(
        "input",
        resetToFirstPage
    );


    departmentFilter.addEventListener(
        "change",
        resetToFirstPage
    );


    designationFilter.addEventListener(
        "change",
        resetToFirstPage
    );


    genderFilter.addEventListener(
        "change",
        resetToFirstPage
    );


    statusFilter.addEventListener(
        "change",
        resetToFirstPage
    );


    resetButton.addEventListener(
        "click",
        function () {

            searchInput.value = "";

            departmentFilter.value = "";

            designationFilter.value = "";

            genderFilter.value = "";

            statusFilter.value = "";

            currentPage = 1;

            renderTable();

        }
    );


    previousButton.addEventListener(
        "click",
        function () {

            if (currentPage > 1) {

                currentPage--;

                renderTable();

            }

        }
    );


    nextButton.addEventListener(
        "click",
        function () {

            const filteredRows =
                filterRows();

            const totalPages =
                Math.max(
                    1,
                    Math.ceil(
                        filteredRows.length
                        / recordsPerPage
                    )
                );


            if (currentPage < totalPages) {

                currentPage++;

                renderTable();

            }

        }
    );


    renderTable();

});

</script>

</html>
