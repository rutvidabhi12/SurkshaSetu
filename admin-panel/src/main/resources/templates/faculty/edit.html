<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{layout/base :: layout(~{::section})}">

<section>

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="page-title mb-1">
                Edit Faculty
            </h2>

            <p class="text-muted mb-0">
                Update faculty member details.
            </p>

        </div>


        <a th:href="@{/faculty}"
           class="btn btn-outline-secondary">

            <i class="bi bi-arrow-left me-2"></i>

            Back

        </a>

    </div>


    <!-- =====================================================
         EDIT FORM
    ====================================================== -->

    <form th:action="@{/faculty/update}"
          method="post"
          enctype="multipart/form-data"
          id="facultyEditForm">


        <!-- FACULTY ID -->

        <input type="hidden"
               name="id"
               th:value="${faculty.id}">


        <div class="card shadow-sm">

            <div class="card-body p-4">

                <div class="row g-4">


                    <!-- =================================================
                         FIRST NAME
                    ================================================== -->

                    <div class="col-md-4">

                        <label class="form-label fw-semibold">

                            First Name
                            <span class="text-danger">*</span>

                        </label>

                        <input type="text"
                               name="firstName"
                               class="form-control"
                               th:value="${faculty.firstName}"
                               required>

                    </div>


                    <!-- MIDDLE NAME -->

                    <div class="col-md-4">

                        <label class="form-label fw-semibold">

                            Middle Name

                        </label>

                        <input type="text"
                               name="middleName"
                               class="form-control"
                               th:value="${faculty.middleName}">

                    </div>


                    <!-- LAST NAME -->

                    <div class="col-md-4">

                        <label class="form-label fw-semibold">

                            Last Name
                            <span class="text-danger">*</span>

                        </label>

                        <input type="text"
                               name="lastName"
                               class="form-control"
                               th:value="${faculty.lastName}"
                               required>

                    </div>


                    <!-- FACULTY CODE -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">

                            Faculty Code
                            <span class="text-danger">*</span>

                        </label>

                        <input type="text"
                               name="facultyCode"
                               class="form-control"
                               th:value="${faculty.facultyCode}"
                               required>

                    </div>


                    <!-- EMAIL -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">

                            Email
                            <span class="text-danger">*</span>

                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               th:value="${faculty.email}"
                               required>

                    </div>


                    <!-- MOBILE -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">

                            Mobile
                            <span class="text-danger">*</span>

                        </label>

                        <input type="tel"
                               name="mobile"
                               class="form-control"
                               th:value="${faculty.mobile}"
                               maxlength="10"
                               pattern="[0-9]{10}"
                               required>

                    </div>


                    <!-- =================================================
                         DEPARTMENT
                    ================================================== -->

                    <div class="col-md-6">

                        <div class="d-flex align-items-center mb-2">

                            <label class="form-label fw-semibold mb-0">

                                Department
                                <span class="text-danger">*</span>

                            </label>


                            <!-- ADD DEPARTMENT -->

                            <a th:href="@{/departments/add}"
                               class="btn btn-success ms-auto"
                               title="Add Department">

                                <i class="bi bi-plus-lg"></i>

                            </a>

                        </div>


                        <select name="department"
                                class="form-select"
                                required>

                            <option value="">
                                Select Department
                            </option>


                            <option th:each="department : ${departments}"
                                    th:value="${department.departmentName}"
                                    th:text="${department.departmentName}"
                                    th:selected="${department.departmentName == faculty.department}">

                            </option>

                        </select>

                    </div>


                    <!-- =================================================
                         DESIGNATION
                    ================================================== -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">

                            Designation
                            <span class="text-danger">*</span>

                        </label>


                        <select name="designation"
                                class="form-select"
                                required>

                            <option value="">
                                Select Designation
                            </option>


                            <option value="Dean & Professor"
                                    th:selected="${faculty.designation == 'Dean & Professor'}">

                                Dean & Professor

                            </option>


                            <option value="Head & Professor"
                                    th:selected="${faculty.designation == 'Head & Professor'}">

                                Head & Professor

                            </option>


                            <option value="Senior Professor"
                                    th:selected="${faculty.designation == 'Senior Professor'}">

                                Senior Professor

                            </option>


                            <option value="Professor"
                                    th:selected="${faculty.designation == 'Professor'}">

                                Professor

                            </option>


                            <option value="Associate Professor"
                                    th:selected="${faculty.designation == 'Associate Professor'}">

                                Associate Professor

                            </option>


                            <option value="Assistant Professor"
                                    th:selected="${faculty.designation == 'Assistant Professor'}">

                                Assistant Professor

                            </option>


                            <option value="Lecturer"
                                    th:selected="${faculty.designation == 'Lecturer'}">

                                Lecturer

                            </option>

                        </select>

                    </div>


                    <!-- =================================================
                         GENDER
                    ================================================== -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">

                            Gender
                            <span class="text-danger">*</span>

                        </label>


                        <select name="gender"
                                class="form-select"
                                required>

                            <option value="">
                                Select Gender
                            </option>


                            <option value="Male"
                                    th:selected="${faculty.gender == 'Male'}">

                                Male

                            </option>


                            <option value="Female"
                                    th:selected="${faculty.gender == 'Female'}">

                                Female

                            </option>


                            <option value="Other"
                                    th:selected="${faculty.gender == 'Other'}">

                                Other

                            </option>

                        </select>

                    </div>


                    <!-- =================================================
                         PROFILE PHOTO
                    ================================================== -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">

                            Profile Photo

                        </label>


                        <!-- CURRENT PHOTO -->

                        <div class="mb-3">

                            <img th:if="${faculty.photo != null and !#strings.isEmpty(faculty.photo)}"
                                 th:src="@{'http://localhost:8082/api/faculty/' + ${faculty.id} + '/photo'}"
                                 alt="Current Photo"
                                 id="currentPhoto"
                                 style="
                                    width:80px;
                                    height:80px;
                                    object-fit:cover;
                                    border-radius:50%;
                                    border:2px solid #6b4f3f;
                                 ">


                            <div th:if="${faculty.photo == null or #strings.isEmpty(faculty.photo)}"
                                 id="noPhoto"
                                 class="rounded-circle d-flex align-items-center justify-content-center"
                                 style="
                                    width:80px;
                                    height:80px;
                                    background:#f5f5f5;
                                    border:2px solid #6b4f3f;
                                    color:#6c757d;
                                 ">

                                <i class="bi bi-person fs-2"></i>

                            </div>

                        </div>


                        <!-- NEW PHOTO -->

                        <input type="file"
                               name="photoFile"
                               id="facultyPhoto"
                               class="form-control"
                               accept="image/*">


                        <!-- NEW PHOTO PREVIEW -->

                        <div id="photoPreview"
                             class="mt-3"
                             style="display:none;">

                            <small class="text-muted d-block mb-2">
                                New Photo Preview
                            </small>

                            <img id="previewImage"
                                 src=""
                                 alt="New Photo"
                                 style="
                                    width:80px;
                                    height:80px;
                                    object-fit:cover;
                                    border-radius:50%;
                                    border:2px solid #198754;
                                 ">

                        </div>

                    </div>


                    <!-- =================================================
                         STATUS
                    ================================================== -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">

                            Status

                        </label>


                        <select name="active"
                                class="form-select">

                            <option value="true"
                                    th:selected="${faculty.active}">

                                Active

                            </option>


                            <option value="false"
                                    th:selected="${!faculty.active}">

                                Inactive

                            </option>

                        </select>

                    </div>


                </div>

            </div>


            <!-- =====================================================
                 FOOTER
            ====================================================== -->

            <div class="card-footer text-end">


                <!-- CANCEL -->

                <a th:href="@{/faculty}"
                   class="btn btn-secondary">

                    <i class="bi bi-x-circle me-1"></i>

                    Cancel

                </a>


                <!-- UPDATE -->

                <button type="submit"
                        id="updateFacultyButton"
                        class="btn btn-success ms-2">

                    <i class="bi bi-check-circle me-2"></i>

                    Update Faculty

                </button>

            </div>

        </div>

    </form>

</section>

</div>


<!-- =====================================================
     PHOTO PREVIEW SCRIPT
====================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const photoInput =
            document.getElementById("facultyPhoto");

        const previewBox =
            document.getElementById("photoPreview");

        const previewImage =
            document.getElementById("previewImage");


        if (photoInput) {

            photoInput.addEventListener(
                "change",
                function () {

                    const file =
                        this.files[0];


                    if (!file) {

                        previewBox.style.display =
                            "none";

                        previewImage.src =
                            "";

                        return;
                    }


                    if (!file.type.startsWith("image/")) {

                        alert(
                            "Please select an image file."
                        );

                        this.value = "";

                        previewBox.style.display =
                            "none";

                        return;
                    }


                    const reader =
                        new FileReader();


                    reader.onload =
                        function (event) {

                            previewImage.src =
                                event.target.result;

                            previewBox.style.display =
                                "block";

                        };


                    reader.readAsDataURL(file);

                }
            );

        }

    }

);

</script>


<!-- =====================================================
     UPDATE BUTTON PROTECTION
====================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const form =
            document.getElementById(
                "facultyEditForm"
            );


        const button =
            document.getElementById(
                "updateFacultyButton"
            );


        if (form && button) {

            form.addEventListener(
                "submit",
                function () {

                    button.disabled = true;


                    button.innerHTML =
                        '<span class="spinner-border spinner-border-sm me-2"></span>' +
                        'Updating Faculty...';

                }
            );

        }

    }

);

</script>

</html>
