<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{layout/base :: layout(~{::section})}">

<section>

    <!-- PAGE HEADER -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="page-title mb-1">
                Faculty Details
            </h2>

            <p class="text-muted mb-0">
                View faculty member details.
            </p>

        </div>

        <a th:href="@{/faculty}"
           class="btn btn-outline-secondary">

            <i class="bi bi-arrow-left me-2"></i>

            Back

        </a>

    </div>


    <!-- FACULTY PROFILE -->

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <div class="row g-4">


                <!-- PROFILE PHOTO -->

                <div class="col-md-3 text-center">

                    <div th:if="${faculty.photo != null and faculty.photo != ''}">

                        <img th:src="@{'/uploads/faculty/' + ${faculty.photo}}"
                             width="150"
                             height="150"
                             class="rounded-circle"
                             style="object-fit:cover;">

                    </div>

                    <i th:unless="${faculty.photo != null and faculty.photo != ''}"
                       class="bi bi-person-circle"
                       style="font-size:150px;">
                    </i>

                    <h5 class="mt-3 mb-0">

                        <span th:text="${faculty.firstName}">
                        </span>

                        <span th:if="${faculty.middleName != null and faculty.middleName != ''}"
                              th:text="' ' + ${faculty.middleName}">
                        </span>

                        <span th:text="' ' + ${faculty.lastName}">
                        </span>

                    </h5>

                    <p class="text-muted mb-0"
                       th:text="${faculty.facultyCode}">
                    </p>

                </div>


                <!-- FACULTY INFORMATION -->

                <div class="col-md-9">

                    <div class="row g-4">


                        <!-- FIRST NAME -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                First Name
                            </label>

                            <div class="form-control bg-light"
                                 th:text="${faculty.firstName}">
                                -
                            </div>

                        </div>


                        <!-- MIDDLE NAME -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Middle Name
                            </label>

                            <div class="form-control bg-light"
                                 th:text="${faculty.middleName}">
                                -
                            </div>

                        </div>


                        <!-- LAST NAME -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Last Name
                            </label>

                            <div class="form-control bg-light"
                                 th:text="${faculty.lastName}">
                                -
                            </div>

                        </div>


                        <!-- FACULTY CODE -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Faculty Code
                            </label>

                            <div class="form-control bg-light"
                                 th:text="${faculty.facultyCode}">
                                -
                            </div>

                        </div>


                        <!-- EMAIL -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Email
                            </label>

                            <div class="form-control bg-light"
                                 th:text="${faculty.email}">
                                -
                            </div>

                        </div>


                        <!-- MOBILE -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Mobile
                            </label>

                            <div class="form-control bg-light"
                                 th:text="${faculty.mobile}">
                                -
                            </div>

                        </div>


                        <!-- DEPARTMENT -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Department
                            </label>

                            <div class="form-control bg-light"
                                 th:text="${faculty.departmentName}">
                                -
                            </div>

                        </div>


                        <!-- DESIGNATION -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Designation
                            </label>

                            <div class="form-control bg-light"
                                 th:text="${faculty.designation}">
                                -
                            </div>

                        </div>


                        <!-- GENDER -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Gender
                            </label>

                            <div class="form-control bg-light"
                                 th:text="${faculty.gender}">
                                -
                            </div>

                        </div>


                        <!-- STATUS -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Status
                            </label>

                            <div class="form-control bg-light">

                                <span class="badge bg-success"
                                      th:if="${faculty.active}">
                                    Active
                                </span>

                                <span class="badge bg-danger"
                                      th:unless="${faculty.active}">
                                    Inactive
                                </span>

                            </div>

                        </div>


                    </div>

                </div>

            </div>

        </div>


        <!-- FOOTER -->

        <div class="card-footer text-end">

            <a th:href="@{/faculty}"
               class="btn btn-secondary">

                <i class="bi bi-arrow-left me-2"></i>

                Back

            </a>

            <a th:href="@{/faculty/edit/{id}(id=${faculty.id})}"
               class="btn btn-warning ms-2">

                <i class="bi bi-pencil-square me-2"></i>

                Edit Faculty

            </a>

        </div>

    </div>

</section>

</div>

</html>
