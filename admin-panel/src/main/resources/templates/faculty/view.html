<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{layout/base :: layout(~{::section})}">

<section>

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="page-title mb-1">
                Faculty Details
            </h2>

            <p class="text-muted mb-0">
                View faculty member details.
            </p>

        </div>


        <a th:href="@{/faculty}"
           class="btn btn-outline-secondary">

            <i class="bi bi-arrow-left me-2"></i>

            Back

        </a>

    </div>


    <!-- =====================================================
         FACULTY DETAILS CARD
    ====================================================== -->

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <div class="row g-4">


                <!-- =================================================
                     PHOTO / PROFILE
                ================================================== -->

                <div class="col-md-4 text-center">

                    <div class="mb-3">

                        <!-- PHOTO EXISTS -->

                        <img th:if="${faculty.photo != null and !#strings.isEmpty(faculty.photo)}"
                             th:src="@{'http://localhost:8082/api/faculty/' + ${faculty.id} + '/photo'}"
                             alt="Faculty Photo"
                             class="rounded-circle"
                             style="
                                width:180px;
                                height:180px;
                                object-fit:cover;
                                border:4px solid #6b4f3f;
                             ">


                        <!-- PHOTO NOT EXISTS -->

                        <div th:if="${faculty.photo == null or #strings.isEmpty(faculty.photo)}"
                             class="rounded-circle d-flex align-items-center justify-content-center mx-auto"
                             style="
                                width:180px;
                                height:180px;
                                border:4px solid #6b4f3f;
                                background:#f5f5f5;
                                font-size:70px;
                                color:#6c757d;
                             ">

                            <i class="bi bi-person"></i>

                        </div>

                    </div>


                    <!-- NAME -->

                    <h4 class="mb-1"
                        th:text="${faculty.firstName + ' ' +
                                 (faculty.middleName != null ?
                                 faculty.middleName + ' ' : '') +
                                 faculty.lastName}">

                        Faculty Name

                    </h4>


                    <!-- CODE -->

                    <p class="text-muted mb-0"
                       th:text="${faculty.facultyCode}">

                        GV-CS-001

                    </p>

                </div>


                <!-- =================================================
                     DETAILS
                ================================================== -->

                <div class="col-md-8">

                    <div class="row g-4">


                        <!-- FIRST NAME -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                First Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:value="${faculty.firstName}"
                                   readonly>

                        </div>


                        <!-- MIDDLE NAME -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Middle Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:value="${faculty.middleName}"
                                   readonly>

                        </div>


                        <!-- LAST NAME -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Last Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:value="${faculty.lastName}"
                                   readonly>

                        </div>


                        <!-- FACULTY CODE -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Faculty Code
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:value="${faculty.facultyCode}"
                                   readonly>

                        </div>


                        <!-- EMAIL -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Email
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:value="${faculty.email}"
                                   readonly>

                        </div>


                        <!-- MOBILE -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Mobile
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:value="${faculty.mobile}"
                                   readonly>

                        </div>


                        <!-- DEPARTMENT -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Department
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:value="${faculty.department}"
                                   readonly>

                        </div>


                        <!-- DESIGNATION -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Designation
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:value="${faculty.designation}"
                                   readonly>

                        </div>


                        <!-- GENDER -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Gender
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:value="${faculty.gender}"
                                   readonly>

                        </div>


                        <!-- STATUS -->

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Status
                            </label>

                            <div class="form-control">

                                <span th:if="${faculty.active}"
                                      class="badge bg-success">

                                    Active

                                </span>


                                <span th:unless="${faculty.active}"
                                      class="badge bg-danger">

                                    Inactive

                                </span>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- =====================================================
             FOOTER
        ====================================================== -->

        <div class="card-footer text-end">

            <a th:href="@{'/faculty/edit/' + ${faculty.id}}"
               class="btn btn-warning">

                <i class="bi bi-pencil-square me-2"></i>

                Edit Faculty

            </a>

            <a th:href="@{/faculty}"
               class="btn btn-secondary ms-2">

                Back

            </a>

        </div>

    </div>

</section>

</div>

</html>
