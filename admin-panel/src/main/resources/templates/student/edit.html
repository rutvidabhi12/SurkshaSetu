<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{layout/base :: layout(~{::section})}">

<section>

    <!-- Page Header -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="page-title mb-1">
                Edit Student
            </h2>

            <p class="text-muted mb-0">
                Update student information.
            </p>

        </div>

        <a th:href="@{/students}"
           class="btn btn-outline-secondary">

            <i class="bi bi-arrow-left me-2"></i>

            Back

        </a>

    </div>


    <!-- Edit Form -->

    <form th:action="@{/students/update}"
          th:object="${student}"
          method="post">

        <!-- Student ID -->

        <input type="hidden"
               th:field="*{id}">


        <!-- Existing Department -->

        <input type="hidden"
               name="department.id"
               th:value="${student.department.id}">


        <!-- Existing Course -->

        <input type="hidden"
               name="course.id"
               th:value="${student.course.id}">


        <!-- Existing Semester -->

        <input type="hidden"
               name="semester.id"
               th:value="${student.semester.id}">


        <div class="card shadow-sm">


            <!-- Card Header -->

            <div class="card-header bg-white">

                <h5 class="mb-0">

                    <i class="bi bi-person-fill me-2"></i>

                    Student Information

                </h5>

            </div>


            <!-- Card Body -->

            <div class="card-body">

                <div class="row g-4">


                    <!-- Enrollment No -->

                    <div class="col-md-4">

                        <label class="form-label fw-semibold">
                            Enrollment No
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{enrollmentNo}"
                               placeholder="Enter Enrollment No"
                               required>

                    </div>


                    <!-- First Name -->

                    <div class="col-md-4">

                        <label class="form-label fw-semibold">
                            First Name
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{firstName}"
                               placeholder="Enter First Name"
                               required>

                    </div>


                    <!-- Middle Name -->

                    <div class="col-md-4">

                        <label class="form-label fw-semibold">
                            Middle Name
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{middleName}"
                               placeholder="Enter Middle Name">

                    </div>


                    <!-- Last Name -->

                    <div class="col-md-4">

                        <label class="form-label fw-semibold">
                            Last Name
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{lastName}"
                               placeholder="Enter Last Name"
                               required>

                    </div>


                    <!-- Gender -->

                    <div class="col-md-4">

                        <label class="form-label fw-semibold">
                            Gender
                        </label>

                        <select class="form-select"
                                th:field="*{gender}"
                                required>

                            <option value="">
                                Select Gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- Mobile -->

                    <div class="col-md-4">

                        <label class="form-label fw-semibold">
                            Mobile
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{mobile}"
                               placeholder="Enter Mobile"
                               required>

                    </div>


                    <!-- Email -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Email
                        </label>

                        <input type="email"
                               class="form-control"
                               th:field="*{email}"
                               placeholder="Enter Email"
                               required>

                    </div>

                    <!-- Department Display -->

                    <div class="col-md-4">

                        <label class="form-label fw-semibold">
                            Department
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${student.department.departmentName}"
                               readonly>

                    </div>


                    <!-- Course Display -->

                    <div class="col-md-4">

                        <label class="form-label fw-semibold">
                            Course
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${student.course.courseName}"
                               readonly>

                    </div>


                    <!-- Semester Display -->

                    <div class="col-md-4">

                        <label class="form-label fw-semibold">
                            Semester
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${student.semester.semesterName}"
                               readonly>

                    </div>


                    <!-- Status -->

                    <div class="col-md-4">

                        <label class="form-label fw-semibold">
                            Status
                        </label>

                        <select class="form-select"
                                th:field="*{active}">

                            <option th:value="true">
                                Active
                            </option>

                            <option th:value="false">
                                Inactive
                            </option>

                        </select>

                    </div>


                </div>

            </div>


            <!-- Card Footer -->

            <div class="card-footer text-end">


                <a th:href="@{/students}"
                   class="btn btn-secondary">

                    <i class="bi bi-x-circle me-2"></i>

                    Cancel

                </a>


                <button type="submit"
                        class="btn btn-success ms-2">

                    <i class="bi bi-check-circle me-2"></i>

                    Update Student

                </button>


            </div>

        </div>

    </form>

</section>

</div>

</html>
