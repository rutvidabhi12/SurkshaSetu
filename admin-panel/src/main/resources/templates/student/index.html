<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/student.css}">

    <script th:src="@{/js/student.js}"></script>

</head>

<body>

<!-- =========================
     Sidebar
========================= -->

<div th:replace="~{layout/sidebar :: sidebar}"></div>


<!-- =========================
     Navbar
========================= -->

<div th:replace="~{layout/navbar :: navbar}"></div>


<!-- =========================
     Main Content
========================= -->

<div class="main-content">

    <div class="container-fluid">


        <!-- =========================
             Success Popup
        ========================= -->

        <div th:if="${param.success}">

            <script>
                window.addEventListener("load", function () {

                    Swal.fire({
                        icon: "success",
                        title: "Import Successful",
                        text: "Students imported successfully.",
                        confirmButtonText: "OK"
                    });

                });
            </script>

        </div>


        <!-- =========================
             Error Popup
        ========================= -->

        <div th:if="${param.error}">

            <script th:inline="javascript">

                window.addEventListener("load", function () {

                    Swal.fire({
                        icon: "error",
                        title: "Import Failed",
                        text: [[${param.error}]],
                        confirmButtonText: "OK"
                    });

                });

            </script>

        </div>


        <!-- =========================
             Page Header
        ========================= -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="page-title mb-1">
                    Student Management
                </h2>

                <p class="text-muted mb-0">
                    Manage students using Excel Import
                </p>

            </div>

        </div>


        <!-- =========================
             Student Import Form
        ========================= -->

        <form th:action="@{/students/upload}"
              method="post"
              enctype="multipart/form-data"
              id="studentImportForm">


            <!-- =========================
                 Filter Card
            ========================= -->

            <div class="card filter-card mb-4">

                <div class="card-body">

                    <div class="row g-3 align-items-end">


                        <!-- Department -->

                        <div class="col-lg-3">

                            <div class="d-flex justify-content-between mb-2">

                                <label class="form-label fw-semibold mb-0">
                                    Department
                                </label>

                                <a th:href="@{/departments/add}"
                                   class="btn btn-success btn-sm">

                                    <i class="bi bi-plus-circle"></i>

                                </a>

                            </div>

                            <select class="form-select"
                                    name="departmentId"
                                    id="departmentId"
                                    required>

                                <option value="">
                                    Select Department
                                </option>

                                <option th:each="department : ${departments}"
                                        th:value="${department.id}"
                                        th:text="${department.departmentName}">
                                </option>

                            </select>

                        </div>


                        <!-- Course -->

                        <div class="col-lg-3">

                            <div class="d-flex justify-content-between mb-2">

                                <label class="form-label fw-semibold mb-0">
                                    Course
                                </label>

                                <a th:href="@{/courses/add}"
                                   class="btn btn-success btn-sm">

                                    <i class="bi bi-plus-circle"></i>

                                </a>

                            </div>

                            <select class="form-select"
                                    name="courseId"
                                    id="courseId"
                                    required>

                                <option value="">
                                    Select Course
                                </option>

                                <option th:each="course : ${courses}"
                                        th:value="${course.id}"
                                        th:text="${course.courseName}">
                                </option>

                            </select>

                        </div>


                        <!-- Semester -->

                        <div class="col-lg-3">

                            <div class="d-flex justify-content-between mb-2">

                                <label class="form-label fw-semibold mb-0">
                                    Semester
                                </label>

                                <a th:href="@{/semesters/add}"
                                   class="btn btn-success btn-sm">

                                    <i class="bi bi-plus-circle"></i>

                                </a>

                            </div>

                            <select class="form-select"
                                    name="semesterId"
                                    id="semesterId"
                                    required>

                                <option value="">
                                    Select Semester
                                </option>

                                <option th:each="semester : ${semesters}"
                                        th:value="${semester.id}"
                                        th:text="${semester.semesterName}">
                                </option>

                            </select>

                        </div>


                        <!-- Upload Excel -->

                        <div class="col-lg-3">

                            <label class="form-label d-block">
                                &nbsp;
                            </label>

                            <button type="button"
                                    class="btn btn-primary w-100"
                                    onclick="document.getElementById('excelFile').click()">

                                <i class="bi bi-upload me-2"></i>

                                Upload Excel

                            </button>

                        </div>

                    </div>

                </div>

            </div>


            <!-- =========================
                 Excel Actions
            ========================= -->

            <div class="card mb-4">

                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">


                        <!-- Left -->

                        <div>

                            <!-- Download Template -->

                            <a th:href="@{/students/template}"
                               class="btn btn-success me-2">

                                <i class="bi bi-download me-2"></i>

                                Download Template

                            </a>


                            <!-- Hidden Excel Input -->

                            <input type="file"
                                   id="excelFile"
                                   name="file"
                                   accept=".xlsx,.xls"
                                   hidden>


                            <!-- Selected File -->

                            <span id="selectedFileName"
                                  class="text-muted ms-2">

                            </span>

                        </div>


                        <!-- Right -->

                        <div>

                            <!-- Import Students -->

                            <button type="submit"
                                    class="btn btn-primary">

                                <i class="bi bi-database-fill-check me-2"></i>

                                Import Students

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </form>


        <!-- =========================
             Student List Header
        ========================= -->

        <div class="card mb-4">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center">

                    <h5 class="mb-0">
                        Student List
                    </h5>

                    <span class="badge bg-success fs-6">

                        Total Students :

                        <span th:text="${#lists.size(students)}">
                            0
                        </span>

                    </span>

                </div>

            </div>

        </div>


        <!-- =========================
             Search
        ========================= -->

        <div class="card mb-4">

            <div class="card-body">

                <div class="row">

                    <div class="col-lg-4 ms-auto">

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-search"></i>

                            </span>

                            <input type="text"
                                id="studentSearch"
                                class="form-control"
                                placeholder="Search Student...">

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- =========================
             Student Table
        ========================= -->

        <div class="card">

            <div class="card-body">

                <div class="table-responsive">

                    <table id="studentTable" class="table table-hover align-middle">

                        <thead class="table-dark">

                        <tr>

                            <th width="70">
                                Photo
                            </th>

                            <th>
                                Enrollment No
                            </th>

                            <th>
                                Student Name
                            </th>

                            <th>
                                Gender
                            </th>

                            <th>
                                Mobile
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Status
                            </th>

                            <th width="180">
                                Action
                            </th>

                        </tr>

                        </thead>


                        <tbody id="studentTableBody">


                        <!-- No Students -->

                        <tr th:if="${#lists.isEmpty(students)}">

                            <td colspan="8"
                                class="text-center py-5">

                                <i class="bi bi-people-fill fs-1 text-secondary"></i>

                                <h5 class="mt-3">
                                    No Students Found
                                </h5>

                                <p class="text-muted mb-0">
                                    Upload an Excel file to import students.
                                </p>

                            </td>

                        </tr>


                        <!-- Student List -->

                        <tr th:each="student : ${students}">


                            <!-- Photo -->

                            <td>

                                <img th:if="${student.photo != null}"
                                     th:src="@{'/uploads/' + ${student.photo}}"
                                     width="45"
                                     height="45"
                                     class="rounded-circle">

                                <i th:if="${student.photo == null}"
                                   class="bi bi-person-circle fs-2">
                                </i>

                            </td>


                            <!-- Enrollment -->

                            <td th:text="${student.enrollmentNo}">
                            </td>


                            <!-- Name -->

                            <td>

                                <span th:text="${student.firstName}">
                                </span>

                                <span th:text="${student.lastName}">
                                </span>

                            </td>


                            <!-- Gender -->

                            <td th:text="${student.gender}">
                            </td>


                            <!-- Mobile -->

                            <td th:text="${student.mobile}">
                            </td>


                            <!-- Email -->

                            <td th:text="${student.email}">
                            </td>


                            <!-- Status -->

                            <td>

                                <span class="badge bg-success"
                                      th:if="${student.active}">

                                    Active

                                </span>

                                <span class="badge bg-danger"
                                      th:unless="${student.active}">

                                    Inactive

                                </span>

                            </td>


                            <!-- Actions -->

                            <td>

                                <!-- View -->

                                <a th:href="@{/students/view/{id}(id=${student.id})}"
                                   class="btn btn-sm btn-info text-white">

                                    <i class="bi bi-eye"></i>

                                </a>


                                <!-- Edit -->

                                <a th:href="@{/students/edit/{id}(id=${student.id})}"
                                   class="btn btn-sm btn-warning">

                                    <i class="bi bi-pencil-square"></i>

                                </a>


                                <!-- Delete -->

                                <a th:href="@{/students/delete/{id}(id=${student.id})}"
                                   class="btn btn-sm btn-danger"
                                   onclick="return confirm('Are you sure you want to delete this student?')">

                                    <i class="bi bi-trash"></i>

                                </a>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>


        <!-- =========================
             Pagination
        ========================= -->

        <div class="d-flex justify-content-end mt-4">

            <nav>

                <ul class="pagination">

                    <li class="page-item disabled">

                        <a class="page-link"
                           href="#">

                            Previous

                        </a>

                    </li>


                    <li class="page-item active">

                        <a class="page-link"
                           href="#">

                            1

                        </a>

                    </li>


                    <li class="page-item disabled">

                        <a class="page-link"
                           href="#">

                            Next

                        </a>

                    </li>

                </ul>

            </nav>

        </div>


    </div>

</div>


<!-- =========================
     Bootstrap JS
========================= -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


<!-- =========================
     SweetAlert2
========================= -->

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


<!-- =========================
     Excel File Selection
========================= -->

<script>

    const excelFile = document.getElementById("excelFile");

    const selectedFileName =
        document.getElementById("selectedFileName");


    excelFile.addEventListener("change", function () {

        if (this.files.length > 0) {

            selectedFileName.textContent =
                this.files[0].name;

        } else {

            selectedFileName.textContent = "";

        }

    });

</script>

</body>

</html>
