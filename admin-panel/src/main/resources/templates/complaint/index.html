
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::section})}">
  
<head>
    <link rel="stylesheet" th:href="@{/css/complaint.css}">
</head>
<body>

<section>
    <div class="container-fluid py-4 complaint-page">
        <div th:if="${success}"
     class="alert alert-success alert-dismissible fade show"
     role="alert">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close"
            data-bs-dismiss="alert"
            aria-label="Close"></button>
</div>

<div th:if="${error}"
     class="alert alert-danger alert-dismissible fade show"
     role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close"
            data-bs-dismiss="alert"
            aria-label="Close"></button>
</div>
        <!-- Page Heading -->
        <div class="complaint-page-header">
            <div>
                <h2 class="complaint-heading">Complaint Management</h2>
                <p class="complaint-subtitle">
                    View and manage student complaints
                </p>
            </div>
        </div>

        <!-- Error Message
        <div th:if="${error != null}"
             class="alert alert-danger"
             role="alert"
             th:text="${error}">
        </div> -->
        
<!-- Complaint Search and Filters -->
<div class="card shadow-sm mb-3">
    <div class="card-body">
        <form th:action="@{/complaints}" method="get">
            <div class="row g-3 align-items-end">

                <div class="col-lg-4 col-md-6">
                    <label for="search" class="form-label">
                        Search Complaint
                    </label>
                    <input type="text"
                           id="search"
                           name="search"
                           class="form-control"
                           placeholder="Enter complaint ID or title"
                           th:value="${search}">
                </div>

                <div class="col-lg-3 col-md-6">
                    <label for="status" class="form-label">
                        Filter by Status
                    </label>
                    <select id="status"
                            name="status"
                            class="form-select">
                        <option value="">All Statuses</option>
                        <option value="PENDING"
                                th:selected="${status == 'PENDING'}">
                            Pending
                        </option>
                        <option value="ASSIGNED"
                                th:selected="${status == 'ASSIGNED'}">
                            Assigned
                        </option>
                        <option value="IN_PROGRESS"
                                th:selected="${status == 'IN_PROGRESS'}">
                            In Progress
                        </option>
                        <option value="RESOLVED"
                                th:selected="${status == 'RESOLVED'}">
                            Resolved
                        </option>
                        <option value="REJECTED"
                                th:selected="${status == 'REJECTED'}">
                            Rejected
                        </option>
                    </select>
                </div>

                <div class="col-lg-3 col-md-6">
                    <label for="category" class="form-label">
                        Filter by Category
                    </label>
                    <select id="category"
                            name="category"
                            class="form-select">
                        <option value="">All Categories</option>
                        <option value="Campus"
                                th:selected="${category == 'Campus'}">
                            Campus
                        </option>
                        <option value="General"
                                th:selected="${category == 'General'}">
                            General
                        </option>
                        <option value="Electrical"
                                th:selected="${category == 'Electrical'}">
                            Electrical
                        </option>
                    </select>
                </div>

                <div class="col-lg-2 col-md-6 d-flex gap-2">
                    <button type="submit"
                            class="btn btn-primary">
                        Search
                    </button>

                    <a th:href="@{/complaints}"
                       class="btn btn-outline-secondary">
                        Reset
                    </a>
                </div>

            </div>
        </form>
    </div>
</div>



<!-- Complaint Pagination -->
<div class="d-flex justify-content-between align-items-center mt-3"
     th:if="${totalPages != null and totalPages > 1}">

    <span class="text-muted">
        Page <span th:text="${currentPage + 1}"></span>
        of <span th:text="${totalPages}"></span>
    </span>

    <div class="d-flex gap-2">

        <a th:if="${currentPage > 0}"
           th:href="@{/complaints(
               page=${currentPage - 1},
               size=10,
               search=${search},
               status=${status},
               category=${category}
           )}"
           class="btn btn-outline-primary btn-sm">
            Previous
        </a>

        <a th:if="${currentPage + 1 < totalPages}"
           th:href="@{/complaints(
               page=${currentPage + 1},
               size=10,
               search=${search},
               status=${status},
               category=${category}
           )}"
           class="btn btn-outline-primary btn-sm">
            Next
        </a>

    </div>
</div>

        <!-- Complaint List Heading -->
        <div class="card">
            <div class="card-body">
                <div class="complaint-list-heading">
                    <span>Complaint List</span>
                    <span class="total-complaints"
                          th:text="'Total Complaints : ' + ${#lists.size(complaints)}">
                        Total Complaints : 0
                    </span>
                </div>
            </div>
        </div>

        
<!-- Complaint Table -->
<div class="card shadow-sm">
    <div class="card-body">

        <div class="table-responsive">
            <table class="table table-hover align-middle">

                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Department Name</th>
                        <th>Faculty Name</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="complaint : ${complaints}">

                        <td th:text="${complaint.id}"></td>

                        <td th:text="${complaint.title}"></td>

                        <td th:text="${complaint.category}"></td>

                        <td th:text="${complaint.departmentName}">Not Available</td>

                        <td th:text="${complaint.facultyName}">Not Assigned</td>

                        <td>
                            <span class="badge bg-danger"
                                  th:if="${complaint.priority == 'HIGH'}"
                                  th:text="${complaint.priority}">
                            </span>

                            <span class="badge bg-warning text-dark"
                                  th:if="${complaint.priority == 'MEDIUM'}"
                                  th:text="${complaint.priority}">
                            </span>

                            <span class="badge bg-secondary"
                                  th:if="${complaint.priority == 'LOW'}"
                                  th:text="${complaint.priority}">
                            </span>
                        </td>

                        <td>
                            <span class="badge bg-success"
                                  th:if="${complaint.status == 'RESOLVED'}"
                                  th:text="${complaint.status}">
                            </span>

                            <span class="badge bg-danger"
                                  th:if="${complaint.status == 'REJECTED'}"
                                  th:text="${complaint.status}">
                            </span>

                            <span class="badge bg-warning text-dark"
                                  th:if="${complaint.status == 'IN_PROGRESS'}"
                                  th:text="${complaint.status}">
                            </span>

                            <span class="badge bg-secondary"
                                  th:if="${complaint.status != 'RESOLVED'
                                          and complaint.status != 'REJECTED'
                                          and complaint.status != 'IN_PROGRESS'}"
                                  th:text="${complaint.status}">
                            </span>
                        </td>

                        <td>
                            <form
                                th:action="@{/complaints/{id}/update(id=${complaint.id})}"
                                method="post"
                                class="complaint-update-form">

                                <select name="status"
                                        class="form-select form-select-sm mb-2 status-select"
                                        required>

                                    <option value="IN_PROGRESS"
                                            th:selected="${complaint.status == 'IN_PROGRESS'}">
                                        In Progress
                                    </option>

                                    <option value="RESOLVED"
                                            th:selected="${complaint.status == 'RESOLVED'}">
                                        Resolved
                                    </option>

                                    <option value="REJECTED"
                                            th:selected="${complaint.status == 'REJECTED'}">
                                        Rejected
                                    </option>
                                </select>

                                <input type="text"
                                       name="resolutionNote"
                                       class="form-control form-control-sm mb-2 resolution-note"
                                       placeholder="Resolution note">

                                <input type="text"
                                       name="rejectionReason"
                                       class="form-control form-control-sm mb-2 rejection-reason"
                                       placeholder="Rejection reason">

                                <button type="submit"
                                        class="btn btn-primary btn-sm">
                                    Update
                                </button>

                            </form>

                        <a th:href="@{/complaints/{id}(id=${complaint.id})}"
                        class="btn btn-outline-primary btn-sm view-details-btn">
                            <i class="bi bi-eye"></i> View Details
                        </a>
                        </td>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(complaints)}">
                        <td colspan="8"
                            class="text-center text-muted py-4">
                            No complaints found.
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>

    </div>
</div>


        <script th:src="@{/js/complaint.js}"></script>
    </div>
</section>

</body>
</html>
