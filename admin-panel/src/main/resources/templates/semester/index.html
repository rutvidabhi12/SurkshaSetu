<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{layout/base :: layout(~{::section})}">

<section>

    <!-- ========================= -->
    <!-- Success Popup -->
    <!-- ========================= -->

    <div th:if="${param.success}">

        <script>
            Swal.fire({
                icon: 'success',
                title: 'Success',
                text: 'Semester Added Successfully',
                confirmButtonText: 'OK'
            });
        </script>

    </div>


    <div th:if="${param.updated}">

        <script>
            Swal.fire({
                icon: 'success',
                title: 'Success',
                text: 'Semester Updated Successfully',
                confirmButtonText: 'OK'
            });
        </script>

    </div>


    <div th:if="${param.deleted}">

        <script>
            Swal.fire({
                icon: 'success',
                title: 'Success',
                text: 'Semester Deleted Successfully',
                confirmButtonText: 'OK'
            });
        </script>

    </div>


    <!-- ========================= -->
    <!-- Page Header -->
    <!-- ========================= -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="page-title mb-1">
                Semester Management
            </h2>

            <p class="text-muted mb-0">
                Manage all semesters from one place.
            </p>

        </div>
        <div>
            <a th:href="@{/students}"
           class="btn btn-outline-secondary">

            <i class="bi bi-arrow-left me-2"></i>

            Home

        </a>

        <a th:href="@{/semesters/add}"
           class="btn btn-success">

            <i class="bi bi-plus-circle me-2"></i>

            Add Semester

        </a>

    </div>
    </div>

    <!-- ========================= -->
    <!-- Search / Filter -->
    <!-- ========================= -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <div class="row g-3 align-items-end">


                <!-- Course -->

                <div class="col-lg-4">

                    <label class="form-label fw-semibold">
                        Course
                    </label>

                    <select class="form-select">

                        <option value="">
                            All Courses
                        </option>

                        <option th:each="course : ${courses}"
                                th:value="${course.id}"
                                th:text="${course.courseName}">
                        </option>

                    </select>

                </div>


                <!-- Search -->

                <div class="col-lg-5">

                    <label class="form-label fw-semibold">
                        Search
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-search"></i>

                        </span>

                        <input type="text"
                            id="semesterSearch"
                            class="form-control"
                            placeholder="Search Semester...">

                    </div>

                </div>


                <!-- Filter -->

                <div class="col-lg-3">

                    <button type="button"
                            class="btn btn-primary w-100">

                        <i class="bi bi-funnel-fill me-2"></i>

                        Apply Filter

                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- Semester Table -->
    <!-- ========================= -->

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">


                    <!-- Header -->

                    <thead class="table-success">

                    <tr>

                        <th width="70">
                            #
                        </th>

                        <th>
                            Semester Name
                        </th>

                        <th>
                            Semester Number
                        </th>

                        <th>
                            Course
                        </th>

                        <th>
                            Status
                        </th>

                        <th width="150">
                            Action
                        </th>

                    </tr>

                    </thead>


                    <!-- Body -->

                    <tbody id="semesterTableBody">


                    <!-- No Data -->

                    <tr th:if="${#lists.isEmpty(semesters)}">

                        <td colspan="6"
                            class="text-center py-5">

                            <i class="bi bi-bookmark fs-1 text-secondary"></i>

                            <h5 class="mt-3">
                                No Semester Found
                            </h5>

                            <p class="text-muted mb-0">
                                Click "Add Semester" to create your first semester.
                            </p>

                        </td>

                    </tr>


                    <!-- Semester List -->

                    <tr th:each="semester, stat : ${semesters}">


                        <!-- Number -->

                        <td th:text="${stat.count}">
                        </td>


                        <!-- Semester Name -->

                        <td th:text="${semester.semesterName}">
                        </td>


                        <!-- Semester Number -->

                        <td th:text="${semester.semesterNumber}">
                        </td>


                        <!-- Course -->

                        <td th:text="${semester.course.courseName}">
                        </td>


                        <!-- Status -->

                        <td>

                            <span class="badge bg-success"
                                  th:if="${semester.status == 'Active'}">

                                Active

                            </span>

                            <span class="badge bg-danger"
                                  th:unless="${semester.status == 'Active'}">

                                Inactive

                            </span>

                        </td>


                        <!-- Action -->

                        <td>

                            <!-- Edit -->

                            <a th:href="@{/semesters/edit/{id}(id=${semester.id})}"
                               class="btn btn-warning btn-sm"
                               title="Edit Semester">

                                <i class="bi bi-pencil-square"></i>

                            </a>


                            <!-- Delete -->

                            <a th:href="@{/semesters/delete/{id}(id=${semester.id})}"
                               class="btn btn-danger btn-sm"
                               title="Delete Semester"
                               onclick="return confirm('Delete this semester?')">

                                <i class="bi bi-trash"></i>

                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- Pagination -->
    <!-- ========================= -->

    <div class="d-flex justify-content-end mt-4">

        <nav>

            <ul class="pagination">

                <li class="page-item disabled">

                    <a class="page-link" href="#">
                        Previous
                    </a>

                </li>

                <li class="page-item active">

                    <a class="page-link" href="#">
                        1
                    </a>

                </li>

                <li class="page-item disabled">

                    <a class="page-link" href="#">
                        Next
                    </a>

                </li>

            </ul>

        </nav>

    </div>

</section>

</div>

<script th:src="@{/js/semester.js}"></script>
</html>
