<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{layout/base :: layout(~{::section})}">

<section>

    <!-- ========================= -->
    <!-- Error Popup -->
    <!-- ========================= -->

    <div th:if="${error}">

        <script th:inline="javascript">

            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: [[${error}]],
                confirmButtonText: 'OK'
            });

        </script>

    </div>


    <!-- ========================= -->
    <!-- Page Header -->
    <!-- ========================= -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="page-title mb-1">
                Edit Semester
            </h2>

            <p class="text-muted mb-0">
                Update semester information.
            </p>

        </div>


        <!-- Back -->

        <a th:href="@{/semesters}"
           class="btn btn-outline-secondary">

            <i class="bi bi-arrow-left me-2"></i>

            Back

        </a>

    </div>


    <!-- ========================= -->
    <!-- Semester Edit Form -->
    <!-- ========================= -->

    <form th:action="@{/semesters/update}"
          th:object="${semester}"
          method="post">

        <!-- Hidden ID -->

        <input type="hidden"
               th:field="*{id}">


        <div class="card shadow-sm">

            <div class="card-body">

                <div class="row g-4">


                    <!-- Course -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Course
                        </label>

                        <div class="input-group">

                            <select class="form-select"
                                    th:field="*{course}"
                                    required>

                                <option value="">
                                    Select Course
                                </option>

                                <option th:each="course : ${courses}"
                                        th:value="${course.id}"
                                        th:text="${course.courseName}">
                                </option>

                            </select>


                            <!-- Add Course -->

                            <a th:href="@{/courses/add}"
                               class="btn btn-success"
                               title="Add Course">

                                <i class="bi bi-plus-lg"></i>

                            </a>

                        </div>

                    </div>


                    <!-- Semester Name -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Semester Name
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{semesterName}"
                               placeholder="Enter Semester Name"
                               required>

                    </div>


                    <!-- Semester Number -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Semester Number
                        </label>

                        <input type="number"
                               class="form-control"
                               th:field="*{semesterNumber}"
                               placeholder="Enter Semester Number"
                               min="1"
                               required>

                    </div>


                    <!-- Status -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Status
                        </label>

                        <select class="form-select"
                                th:field="*{status}"
                                required>

                            <option value="">
                                Select Status
                            </option>

                            <option value="Active">
                                Active
                            </option>

                            <option value="Inactive">
                                Inactive
                            </option>

                        </select>

                    </div>

                </div>

            </div>


            <!-- ========================= -->
            <!-- Footer -->
            <!-- ========================= -->

            <div class="card-footer text-end">

                <a th:href="@{/semesters}"
                   class="btn btn-secondary">

                    Cancel

                </a>

                <button type="submit"
                        class="btn btn-primary ms-2">

                    <i class="bi bi-check-circle me-2"></i>

                    Update Semester

                </button>

            </div>

        </div>

    </form>

</section>

</div>

</html>
