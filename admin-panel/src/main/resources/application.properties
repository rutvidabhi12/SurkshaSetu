spring.application.name=admin-panel

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/surakshasetu_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Thymeleaf
# ===============================
spring.thymeleaf.cache=false

# ===============================
# Server
# ===============================
server.port=8080
server.address=0.0.0.0

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=INFO

# ===============================
# Lost & Found Microservice API
# ===============================
lostfound.service.base-url=${LOSTFOUND_API_URL:http://localhost:8085}
lostfound.service.username=${LOSTFOUND_API_USERNAME:admin}
lostfound.service.password=${LOSTFOUND_API_PASSWORD:admin123}
